<VirtualHost *:80>
    # The PHP front controller lives in api/. Pointing the docroot straight at
    # api/ means "/products", "/auth/login", "/admin/purchase-orders" etc. resolve
    # against api/.htaccess, which rewrites them all to api/index.php.
    DocumentRoot /var/www/html/api

    <Directory /var/www/html/api>
        Options -Indexes +FollowSymLinks
        # Required so api/.htaccess (RewriteRule + php_flag/php_value) takes effect.
        AllowOverride All
        Require all granted
    </Directory>

    DirectoryIndex index.php

    # Log to the container's stdout/stderr so `docker compose logs api` shows them.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
