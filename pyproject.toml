[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systemintel"
version = "2.4.0"
description = "Deterministic code-analysis + multi-layer testing engine (API + DB + Browser)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SystemIntel contributors" }]
keywords = ["testing", "code-analysis", "system-graph", "api-testing", "oracle"]

dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "playwright>=1.42.0,<2.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "mysql-connector-python>=8.3.0,<9.0.0",
    "networkx>=3.2.1,<4.0.0",
    "jinja2>=3.1.3,<4.0.0",
    "PyYAML>=6.0.1,<7.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
systemintel = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
