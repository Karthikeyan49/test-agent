<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SystemIntel - AI-Powered Software System Intelligence & Autonomous Testing Platform</title>
  <meta name="description" content="Production-grade developer and testing platform for automated architecture discovery, system graph visualization, data lineage, evidence-based test generation, Playwright browser execution, and AI failure intelligence.">
  
  <!-- Modern Typography from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0284c7',
              600: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
              glow: '#38bdf8'
            },
            surface: {
              900: '#0b0f17',
              800: '#111827',
              700: '#1f2937',
              600: '#374151'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Vis.js Network for Dynamic Interactive System Graph Visualization -->
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body class="bg-surface-900 text-slate-100 font-sans antialiased overflow-x-hidden">

  <div id="app" class="flex h-screen w-screen overflow-hidden">
    <!-- Left Navigation Sidebar -->
    <aside class="w-64 bg-surface-800 border-r border-slate-800 flex flex-col flex-shrink-0 z-20">
      <!-- Logo & Brand Header -->
      <div class="h-16 border-b border-slate-800 flex items-center px-5 gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-sky-500/20 font-bold">
          <i data-lucide="cpu" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-slate-100 text-lg tracking-tight leading-none">System<span class="text-sky-400">Intel</span></h1>
          <span class="text-[10px] uppercase font-bold tracking-wider text-slate-500">Autonomous Testing</span>
        </div>
      </div>

      <!-- Active Project Selector -->
      <div class="p-3">
        <div class="bg-slate-900/80 border border-slate-700/60 rounded-xl p-3 flex items-center justify-between cursor-pointer hover:border-sky-500/50 transition">
          <div class="flex items-center gap-2.5 overflow-hidden">
            <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
            <div class="truncate">
              <div class="text-xs font-semibold text-slate-200 truncate">Demo ERP Suite</div>
              <div class="text-[10px] text-slate-400">Node.js + Express + Postgres</div>
            </div>
          </div>
          <i data-lucide="chevrons-up-down" class="w-4 h-4 text-slate-400 flex-shrink-0"></i>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="flex-1 overflow-y-auto px-3 py-2 space-y-1 text-xs font-medium custom-scrollbar">
        <div class="px-3 pt-2 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider">System Architecture</div>
        
        <button onclick="app.navigate('dashboard')" id="nav-dashboard" class="nav-item active">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
        </button>

        <button onclick="app.navigate('projects')" id="nav-projects" class="nav-item">
          <i data-lucide="folder-git-2" class="w-4 h-4"></i> Project Ingestion
        </button>

        <button onclick="app.navigate('graph')" id="nav-graph" class="nav-item">
          <i data-lucide="git-fork" class="w-4 h-4"></i> System Graph
        </button>

        <button onclick="app.navigate('page-connectivity')" id="nav-page-connectivity" class="nav-item">
          <i data-lucide="network" class="w-4 h-4"></i> Page Connectivity
        </button>

        <button onclick="app.navigate('field-connectivity')" id="nav-field-connectivity" class="nav-item">
          <i data-lucide="sliders" class="w-4 h-4"></i> Field Connectivity
        </button>

        <button onclick="app.navigate('impact-analysis')" id="nav-impact-analysis" class="nav-item">
          <i data-lucide="zap" class="w-4 h-4"></i> Impact Analysis
        </button>

        <button onclick="app.navigate('workflows')" id="nav-workflows" class="nav-item">
          <i data-lucide="workflow" class="w-4 h-4"></i> Business Workflows
        </button>

        <div class="px-3 pt-4 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Autonomous Testing</div>

        <button onclick="app.navigate('test-scenarios')" id="nav-test-scenarios" class="nav-item">
          <i data-lucide="file-check-2" class="w-4 h-4"></i> Test Scenarios
        </button>

        <button onclick="app.navigate('test-execution')" id="nav-test-execution" class="nav-item">
          <i data-lucide="play-circle" class="w-4 h-4"></i> Test Execution Console
        </button>

        <button onclick="app.navigate('failures')" id="nav-failures" class="nav-item">
          <i data-lucide="alert-triangle" class="w-4 h-4"></i> Failure Intelligence
        </button>

        <button onclick="app.navigate('reports')" id="nav-reports" class="nav-item">
          <i data-lucide="bar-chart-3" class="w-4 h-4"></i> Testing Reports
        </button>

        <div class="px-3 pt-4 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider">AI Intelligence</div>

        <button onclick="app.navigate('system-query')" id="nav-system-query" class="nav-item">
          <i data-lucide="sparkles" class="w-4 h-4"></i> System AI Assistant
        </button>

        <button onclick="app.navigate('ai-config')" id="nav-ai-config" class="nav-item">
          <i data-lucide="settings-2" class="w-4 h-4"></i> AI Provider Setup
        </button>
      </nav>

      <!-- User / AI Status Bar -->
      <div class="p-3 border-t border-slate-800 bg-surface-900/60 flex items-center justify-between text-xs">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
          <span class="text-slate-300 font-mono text-[11px]">Qwen3-Coder (Local)</span>
        </div>
        <span class="text-[10px] px-2 py-0.5 bg-slate-800 rounded font-semibold text-slate-400">v2.4.0</span>
      </div>
    </aside>

    <!-- Main Workspace View Container -->
    <div class="flex-1 flex flex-col min-w-0 bg-surface-900">
      <!-- Top Navigation Header -->
      <header class="h-16 border-b border-slate-800 bg-surface-800/80 backdrop-blur flex items-center justify-between px-6 z-10">
        <!-- Search Bar -->
        <div class="relative w-96">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input
            id="global-search-input"
            type="text"
            placeholder="Search symbols, pages, fields, APIs, DB columns..."
            oninput="app.handleGlobalSearch(this.value)"
            class="w-full bg-slate-900 border border-slate-700/80 rounded-lg pl-9 pr-4 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition"
          />
        </div>

        <!-- Header Actions -->
        <div class="flex items-center gap-3">
          <button onclick="app.runFullPipeline()" class="px-3.5 py-1.5 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-xs font-semibold flex items-center gap-2 shadow-lg shadow-sky-500/20 transition">
            <i data-lucide="play" class="w-3.5 h-3.5"></i> Run Full Pipeline
          </button>

          <button onclick="app.exportHTMLReport()" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-lg text-xs font-medium flex items-center gap-2 transition">
            <i data-lucide="download" class="w-3.5 h-3.5"></i> Export Report
          </button>
        </div>
      </header>

      <!-- Dynamic View Screen Content -->
      <main id="main-content-view" class="flex-1 overflow-y-auto p-6 relative">
        <!-- Content will be dynamically rendered by bundle.js -->
      </main>
    </div>
  </div>

  <!-- Main Standalone Application Script -->
  <script src="src/bundle.js"></script>
</body>
</html>
